name: Release

# Pushing a tag like v0.1.0 builds the .plasmoid and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test
      - run: bun run package
      - name: Tag must match the packaged version
        run: test -f "dist/tickr-${GITHUB_REF_NAME#v}.plasmoid"
      - run: gh release create "$GITHUB_REF_NAME" dist/*.plasmoid --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
